# Stands up the three databases the test app validates against. See the matching
# setup documents: setup-mongo.md, setup-postgres.sql, setup-sqlserver.sql.
#
#   docker compose -f seed/compose.yaml up -d
#
# Mongo needs a one-time replica-set init:
#   docker compose -f seed/compose.yaml exec mongo mongosh --eval 'rs.initiate()'
services:
  mongo:
    image: mongo:7
    container_name: pulse-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:16
    container_name: pulse-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pulse
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pulse-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "PulseTestApp!2026"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'PulseTestApp!2026' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'PulseTestApp!2026' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 30